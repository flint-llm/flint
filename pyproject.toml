[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flint"
version = "0.1.0-dev"
description = "Deploy LLMs to Kubernetes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "kubernetes>=29.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[project.scripts]
flint = "flint.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["flint*"]

[tool.setuptools.package-data]
flint = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
