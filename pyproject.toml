[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flint-llm"
version = "0.1.0.dev0"
description = "Deploy LLMs to Kubernetes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Flint contributors" }]
keywords = ["llm", "kubernetes", "vllm", "ollama", "tgi", "inference", "deploy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # Upper bounds cap the next major so a surprise release can't silently
    # break users on install day; the scheduled deps-latest CI job exercises
    # the newest compatible versions weekly so drift is caught deliberately.
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "kubernetes>=29.0,<40",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
flint = "flint.cli.main:cli"

[project.urls]
Homepage = "https://github.com/flint-llm/flint"
Issues = "https://github.com/flint-llm/flint/issues"
Changelog = "https://github.com/flint-llm/flint/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["flint*"]

[tool.setuptools.package-data]
flint = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
