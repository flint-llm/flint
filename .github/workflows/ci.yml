name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy flint

      - name: Test
        run: pytest --ignore=tests/integration

  e2e-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flint
        run: pip install -e ".[dev]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Stop system Ollama service
        # The install script registers ollama as a systemd service running as
        # the 'ollama' user, which stores models under /usr/share/ollama and
        # cannot be stopped with `pkill` from the runner user. Stop it so the
        # daemon we run below (and the one `flint serve` starts) both run as the
        # runner user and share the runner's model store (~/.ollama/models).
        run: sudo systemctl stop ollama || true

      - name: Pull model into the runner's store
        run: |
          ollama serve &
          echo $! > /tmp/ollama_prepull.pid
          # Wait for the daemon to accept connections before pulling.
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull tinyllama

      - name: Stop pre-pull daemon
        # Runner-owned now, so a targeted kill works (unlike `pkill` on the
        # system service). `flint serve` starts its own daemon during the test.
        run: |
          kill "$(cat /tmp/ollama_prepull.pid)" 2>/dev/null || true
          sleep 2

      - name: Run E2E tests
        # s2-verify-e2e: 2026-04-23
        run: FLINT_E2E_OLLAMA=1 pytest tests/integration/test_serve_local.py -v

  deploy-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flint
        run: pip install -e ".[dev]"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: flint-e2e

      - name: Run kind E2E tests
        # Smoke test only: asserts the K8s objects are created + idempotent.
        # Real vLLM inference needs a GPU (no CPU image exists), so it is a
        # manually-run gated test: FLINT_E2E_GPU=1 pytest tests/integration/test_deploy_gpu.py
        run: FLINT_E2E_KIND=1 pytest tests/integration/test_deploy_kind.py -v

  route-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flint
        run: pip install -e ".[dev]"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: flint-route

      - name: Install Envoy Gateway
        # Bundles the Gateway API CRDs + the controller into envoy-gateway-system.
        run: |
          kubectl apply --server-side -f https://github.com/envoyproxy/gateway/releases/download/v1.8.2/install.yaml
          kubectl wait --timeout=300s -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available

      - name: Run routing E2E test
        run: FLINT_E2E_ROUTE=1 pytest tests/integration/test_route_kind.py -v

  examples-lint:
    # Cheap guard on examples/: the scripts are user-facing, and a typo in one
    # is only discovered by someone following the docs. Full cluster runs of
    # the examples are covered by deploy-kind/route-kind's equivalent flows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flint
        run: pip install -e ".[dev]"

      - name: Shellcheck the example scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning examples/*/run.sh

      - name: Every run.sh is executable and parses
        run: |
          for f in examples/*/run.sh; do
            test -x "$f" || { echo "$f is not executable"; exit 1; }
            bash -n "$f"
          done

      - name: The deploy commands the examples use still render
        run: |
          flint deploy tinyllama --runtime ollama -n ex --dry-run > /dev/null
          flint deploy tinyllama --runtime ollama --version v1 -n ex --dry-run > /dev/null
          flint deploy mistral --runtime vllm --hf-repo org/repo --gpu 1 -n ex \
            --weights-volume-size 50Gi --memory-request 16Gi --memory-limit 32Gi \
            --hf-token-secret hf-token --dry-run > /dev/null

      - name: Example manifests are valid YAML
        run: python -c "import yaml,sys; list(yaml.safe_load_all(open('examples/03-canary-rollout/gateway.yaml')))"
