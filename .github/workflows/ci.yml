name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy flint

      - name: Test
        run: pytest --ignore=tests/integration

  e2e-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flint
        run: pip install -e ".[dev]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama daemon and pull model
        run: |
          ollama serve &
          sleep 5
          ollama pull tinyllama

      - name: Stop pre-pull daemon
        run: pkill ollama || true && sleep 2

      - name: Run E2E tests
        run: FLINT_E2E_OLLAMA=1 pytest tests/integration/test_serve_local.py -v
